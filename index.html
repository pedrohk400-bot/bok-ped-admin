<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOK PEDRO - لوحة الإدارة</title>

  <link rel="stylesheet" href="style.css">

  <!-- =====================================================
       TESSERACT.JS
       OCR مجاني يعمل داخل المتصفح
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
  </script>

</head>

<body>

  <!-- =====================================================
       LOGIN PAGE
  ====================================================== -->

  <section id="loginPage" class="page login-page">

    <div class="login-card">

      <div class="logo">
        BOK
      </div>

      <h1>BOK PEDRO</h1>

      <p class="muted">
        تسجيل دخول الإدارة
      </p>

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        class="primary-btn"
      >
        تسجيل الدخول
      </button>

      <p
        id="loginError"
        class="error"
      ></p>

    </div>

  </section>


  <!-- =====================================================
       ADMIN PAGE
  ====================================================== -->

  <section
    id="adminPage"
    class="page hidden"
  >

    <header class="topbar">

      <div>

        <div class="brand">
          BOK PEDRO
        </div>

        <div class="subtitle">
          لوحة إدارة طلبات الحسابات
        </div>

      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
      >
        تسجيل الخروج
      </button>

    </header>


    <main class="container">


      <!-- =================================================
           STATISTICS
      ================================================== -->

      <div class="stats">

        <div class="stat-card">

          <span>
            كل الطلبات
          </span>

          <strong id="totalCount">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span>
            قيد الانتظار
          </span>

          <strong id="pendingCount">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span>
            مكتملة
          </span>

          <strong id="completedCount">
            0
          </strong>

        </div>

      </div>


      <!-- =================================================
           SEARCH
      ================================================== -->

      <div class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="ابحث برقم الحساب 7 أرقام"
        >

      </div>


      <!-- =================================================
           MESSAGES
      ================================================== -->

      <div
        id="loading"
        class="message"
      >
        جاري تحميل الطلبات...
      </div>


      <div
        id="empty"
        class="message hidden"
      >
        لا توجد طلبات.
      </div>


      <!-- =================================================
           REQUESTS
      ================================================== -->

      <div
        id="requestsList"
        class="requests-list"
      ></div>

    </main>

  </section>


  <!-- =====================================================
       EDIT MODAL
  ====================================================== -->

  <div
    id="editModal"
    class="modal hidden"
  >

    <div class="modal-card">


      <!-- CLOSE -->

      <button
        id="closeModal"
        class="close-btn"
      >
        ×
      </button>


      <h2>
        إكمال بيانات الحساب
      </h2>


      <p
        id="modalAccount"
        class="modal-account"
      ></p>


      <!-- =================================================
           OCR IMAGE
      ================================================== -->

      <div class="ocr-box">

        <div class="ocr-title">
          استخراج البيانات من صورة
        </div>

        <div class="ocr-description">
          ارفع صورة واجهة بنكك وسيتم استخراج رقم الحساب والاسم ونوع الحساب والفرع فقط.
        </div>


        <input
          id="ocrImage"
          type="file"
          accept="image/*"
          capture="environment"
          hidden
        >


        <button
          id="ocrBtn"
          type="button"
          class="ocr-btn"
        >
          📷 استخراج من صورة
        </button>


        <div
          id="ocrStatus"
          class="ocr-status"
        ></div>

      </div>


      <!-- =================================================
           ACCOUNT NUMBER 16
      ================================================== -->

      <label>
        الرقم البنكي 16 رقم
      </label>

      <input
        id="accountNumber16"
        inputmode="numeric"
        maxlength="16"
        placeholder="0000000000000000"
      >


      <!-- =================================================
           NAME
      ================================================== -->

      <label>
        اسم صاحب الحساب
      </label>

      <input
        id="accountName"
        placeholder="الاسم الكامل"
      >


      <!-- =================================================
           BRANCH
      ================================================== -->

      <label>
        الفرع
      </label>

      <input
        id="accountBranch"
        placeholder="اسم الفرع"
      >


      <!-- =================================================
           ACCOUNT TYPE
      ================================================== -->

      <label>
        نوع الحساب
      </label>

      <select id="accountType">

        <option value="">
          اختر نوع الحساب
        </option>

        <option value="حساب توفير">
          حساب توفير
        </option>

        <option value="حساب جاري">
          حساب جاري
        </option>

        <option value="توفير مميز">
          توفير مميز
        </option>

      </select>


      <!-- =================================================
           SAVE
      ================================================== -->

      <button
        id="saveBtn"
        class="primary-btn"
      >
        حفظ البيانات
      </button>


      <p
        id="saveError"
        class="error"
      ></p>

    </div>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
