<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#b71c1c">

    <title>BOK PEDRO - لوحة الإدارة</title>

    <link rel="stylesheet"
          href="style.css?v=20261005">

</head>

<body>

    <!-- ============================= -->
    <!-- صفحة تسجيل الدخول -->
    <!-- ============================= -->

    <section id="loginPage" class="page login-page">

        <div class="glass-card login-card">

            <div class="brand">
                <div class="brand-logo">BOK</div>
                <h1>BOK PEDRO</h1>
                <p>لوحة إدارة طلبات الحسابات</p>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    placeholder="أدخل البريد الإلكتروني">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    placeholder="أدخل كلمة المرور">
            </div>

            <button id="loginBtn" class="primary-btn">
                تسجيل الدخول
            </button>

            <div id="loginError" class="error-message"></div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- لوحة الإدارة -->
    <!-- ============================= -->

    <section id="adminPage" class="page admin-page hidden">

        <!-- Top Bar -->

        <header class="topbar">

            <div class="topbar-title">
                <div class="mini-logo">BOK</div>

                <div>
                    <h2>BOK PEDRO</h2>
                    <span>لوحة إدارة طلبات الحسابات</span>
                </div>
            </div>

            <button id="logoutBtn" class="logout-btn">
                تسجيل الخروج
            </button>

        </header>


        <main class="container">

            <!-- ============================= -->
            <!-- الإحصائيات -->
            <!-- ============================= -->

            <div class="stats-grid">

                <div class="stat-card">
                    <span class="stat-title">كل الطلبات</span>
                    <strong id="totalCount">0</strong>
                </div>

                <div class="stat-card">
                    <span class="stat-title">قيد الانتظار</span>
                    <strong id="pendingCount">0</strong>
                </div>

                <div class="stat-card">
                    <span class="stat-title">مكتملة</span>
                    <strong id="completedCount">0</strong>
                </div>

            </div>


            <!-- ============================= -->
            <!-- البحث -->
            <!-- ============================= -->

            <div class="search-box">

                <input
                    type="tel"
                    id="searchInput"
                    inputmode="numeric"
                    maxlength="7"
                    placeholder="ابحث برقم الحساب 7 أرقام">

            </div>


            <!-- ============================= -->
            <!-- Loading -->
            <!-- ============================= -->

            <div id="loading" class="state-box">
                جاري تحميل الطلبات...
            </div>


            <!-- ============================= -->
            <!-- Empty -->
            <!-- ============================= -->

            <div id="empty" class="state-box hidden">
                لا توجد طلبات.
            </div>


            <!-- ============================= -->
            <!-- Requests -->
            <!-- ============================= -->

            <div id="requestsList" class="requests-list"></div>

        </main>

    </section>


    <!-- ============================= -->
    <!-- تعديل البيانات -->
    <!-- ============================= -->

    <div id="editModal" class="modal hidden">

        <div class="modal-overlay" id="modalOverlay"></div>

        <div class="modal-card">

            <div class="modal-header">

                <div>
                    <h2>تعديل البيانات</h2>
                    <span id="modalAccount"></span>
                </div>

                <button id="closeModal" class="close-btn">
                    ×
                </button>

            </div>


            <div class="modal-body">

                <!-- ============================= -->
                <!-- OCR -->
                <!-- ============================= -->

                <div class="ocr-box">

                    <div class="ocr-title">
                        استخراج البيانات من الصورة
                    </div>

                    <p class="ocr-description">
                        اختر صورة كاملة من معرض الهاتف وسيتم قراءة البيانات تلقائياً.
                    </p>

                    <label class="image-picker">

                        <span>
                            اختيار صورة من المعرض
                        </span>

                        <input
                            type="file"
                            id="ocrImage"
                            accept="image/*">

                    </label>

                    <div id="ocrPreview" class="ocr-preview hidden">
                        <img id="ocrPreviewImage" alt="معاينة الصورة">
                    </div>

                    <button
                        id="ocrBtn"
                        class="ocr-btn"
                        type="button">
                        قراءة الصورة
                    </button>

                    <div id="ocrStatus" class="ocr-status"></div>

                </div>


                <!-- ============================= -->
                <!-- رقم الحساب -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="accountNumber16">
                        رقم الحساب
                    </label>

                    <input
                        type="tel"
                        id="accountNumber16"
                        inputmode="numeric"
                        maxlength="16"
                        placeholder="رقم الحساب 16 رقم">

                </div>


                <!-- ============================= -->
                <!-- الاسم -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="accountName">
                        الاسم
                    </label>

                    <input
                        type="text"
                        id="accountName"
                        placeholder="اسم صاحب الحساب">

                </div>


                <!-- ============================= -->
                <!-- نوع الحساب -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="accountType">
                        نوع الحساب
                    </label>

                    <input
                        type="text"
                        id="accountType"
                        placeholder="نوع الحساب">

                </div>


                <!-- ============================= -->
                <!-- الفرع -->
                <!-- ============================= -->

                <div class="form-group">

                    <label for="accountBranch">
                        الفرع
                    </label>

                    <input
                        type="text"
                        id="accountBranch"
                        placeholder="اسم الفرع">

                </div>


                <div id="saveError" class="error-message"></div>

            </div>


            <div class="modal-footer">

                <button
                    id="saveBtn"
                    class="primary-btn">
                    حفظ البيانات
                </button>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- Toast -->
    <!-- ============================= -->

    <div id="toast" class="toast"></div>


    <!-- Tesseract -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


    <!-- Firebase / App -->
    <script
        type="module"
        src="app.js?v=20261005">
    </script>

</body>
</html>
