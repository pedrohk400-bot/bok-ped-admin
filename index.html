<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#111111">

    <title>BOK PEDRO - لوحة الإدارة</title>


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css">


    <!--
        Tesseract.js
        OCR مجاني يعمل داخل المتصفح
    -->
    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>

</head>


<body>


<!-- ======================================================
     LOGIN
====================================================== -->

<div
    id="loginPage"
    class="page">


    <div class="login-card">


        <div class="logo">
            BOK
        </div>


        <h1>
            BOK PEDRO
        </h1>


        <p>
            لوحة إدارة طلبات الحسابات
        </p>


        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email">


        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password">


        <button
            id="loginBtn"
            type="button">

            تسجيل الدخول

        </button>


        <div
            id="loginError"
            class="error">
        </div>


    </div>

</div>



<!-- ======================================================
     ADMIN
====================================================== -->

<div
    id="adminPage"
    class="page"
    style="display:none;">


    <!-- TOPBAR -->

    <div class="topbar">


        <div>

            <h2>
                BOK PEDRO
            </h2>

            <span>
                لوحة إدارة طلبات الحسابات
            </span>

        </div>


        <button
            id="logoutBtn"
            type="button">

            تسجيل الخروج

        </button>


    </div>



    <!-- ==================================================
         STATS
    ================================================== -->

    <div class="stats">


        <div class="stat-card">

            <span>
                كل الطلبات
            </span>

            <strong id="totalCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                قيد الانتظار
            </span>

            <strong id="pendingCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                مكتملة
            </span>

            <strong id="completedCount">
                0
            </strong>

        </div>


    </div>



    <!-- ==================================================
         SEARCH
    ================================================== -->

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="ابحث برقم الحساب 7 أرقام"
            inputmode="numeric">

    </div>



    <!-- ==================================================
         LOADING
    ================================================== -->

    <div id="loading">

        جاري تحميل الطلبات...

    </div>



    <div
        id="empty"
        style="display:none;">

        لا توجد طلبات.

    </div>



    <!-- REQUESTS -->

    <div id="requestsList"></div>


</div>



<!-- ======================================================
     EDIT MODAL
====================================================== -->

<div
    id="editModal"
    class="modal"
    style="display:none;">


    <div class="modal-content">


        <button
            id="closeModal"
            class="close-modal"
            type="button">

            ×

        </button>



        <h2>
            إكمال بيانات الحساب
        </h2>


        <div
            id="modalAccount"
            class="modal-account">
        </div>



        <!-- ==================================================
             OCR
        ================================================== -->

        <div class="ocr-box">


            <div class="ocr-title">

                ⚡ استخراج سريع من صورة

            </div>


            <div class="ocr-description">

                اختر صورة من معرض الهاتف لاستخراج بيانات الحساب الأربعة فقط.

            </div>



            <!--
                مهم جداً:

                لا يوجد capture="camera"

                لذلك الاختيار من الصور/المعرض.
            -->

            <input
                type="file"
                id="ocrImage"
                accept="image/*"
                hidden>



            <button
                id="ocrBtn"
                class="ocr-btn"
                type="button">

                🖼️ اختيار صورة من المعرض

            </button>



            <!-- PREVIEW -->

            <img
                id="ocrPreview"
                alt="معاينة الصورة"
                style="display:none;">



            <!-- OCR STATUS -->

            <div
                id="ocrStatus"
                class="ocr-status">

            </div>


        </div>



        <!-- ==================================================
             ACCOUNT NUMBER
        ================================================== -->

        <label>
            رقم الحساب 16 رقم
        </label>


        <input
            type="text"
            id="accountNumber16"
            maxlength="16"
            inputmode="numeric"
            placeholder="رقم الحساب 16 رقم">



        <!-- ==================================================
             NAME
        ================================================== -->

        <label>
            الاسم
        </label>


        <input
            type="text"
            id="accountName"
            placeholder="اسم صاحب الحساب">



        <!-- ==================================================
             BRANCH
        ================================================== -->

        <label>
            الفرع
        </label>


        <input
            type="text"
            id="accountBranch"
            placeholder="اسم الفرع">



        <!-- ==================================================
             TYPE
        ================================================== -->

        <label>
            نوع الحساب
        </label>


        <select id="accountType">


            <option value="">
                اختر نوع الحساب
            </option>


            <option value="حساب توفير">
                حساب توفير
            </option>


            <option value="حساب جاري">
                حساب جاري
            </option>


            <option value="توفير مميز">
                توفير مميز
            </option>


        </select>



        <!-- ERROR -->

        <div
            id="saveError"
            class="error">
        </div>



        <!-- SAVE -->

        <button
            id="saveBtn"
            type="button">

            حفظ وإكمال الطلب

        </button>


    </div>

</div>



<!-- ======================================================
     TOAST
====================================================== -->

<div id="toast"></div>



<!-- APP -->

<script
    type="module"
    src="app.js">
</script>


</body>

</html>
