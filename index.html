<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#111111">

    <title>BOK PEDRO - لوحة الإدارة</title>


    <link
        rel="stylesheet"
        href="style.css">


    <!-- OCR -->
    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
    id="loginPage"
    class="page">


    <div class="login-card">


        <div class="logo">
            BOK
        </div>


        <h1>
            BOK PEDRO
        </h1>


        <p>
            لوحة إدارة طلبات الحسابات
        </p>


        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email">


        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password">


        <button
            id="loginBtn"
            type="button">

            تسجيل الدخول

        </button>


        <div
            id="loginError"
            class="error">
        </div>


    </div>

</div>



<!-- =====================================================
     ADMIN
===================================================== -->

<div
    id="adminPage"
    class="page"
    style="display:none;">


    <div class="topbar">


        <div>

            <h2>
                BOK PEDRO
            </h2>

            <span>
                لوحة إدارة طلبات الحسابات
            </span>

        </div>


        <button
            id="logoutBtn"
            type="button">

            تسجيل الخروج

        </button>


    </div>



    <!-- =================================================
         STATS
    ================================================== -->

    <div class="stats">


        <div class="stat-card">

            <span>
                كل الطلبات
            </span>

            <strong id="totalCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                قيد الانتظار
            </span>

            <strong id="pendingCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                مكتملة
            </span>

            <strong id="completedCount">
                0
            </strong>

        </div>


    </div>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="ابحث برقم الحساب 7 أرقام"
            inputmode="numeric">

    </div>



    <div id="loading">
        جاري تحميل الطلبات...
    </div>


    <div
        id="empty"
        style="display:none;">

        لا توجد طلبات.

    </div>


    <div id="requestsList"></div>


</div>



<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div
    id="editModal"
    class="modal"
    style="display:none;">


    <div class="modal-content">


        <button
            id="closeModal"
            class="close-modal"
            type="button">

            ×

        </button>


        <h2>
            إكمال بيانات الحساب
        </h2>


        <div
            id="modalAccount"
            class="modal-account">
        </div>



        <!-- =================================================
             OCR
        ================================================== -->

        <div class="ocr-box">


            <div class="ocr-title">

                ⚡ استخراج سريع من الصورة

            </div>


            <div class="ocr-description">

                اختر صورة من المعرض ثم حدد بإصبعك المنطقة التي تحتوي على بيانات الحساب.

            </div>


            <!--
                لا يوجد capture
                لذلك الاختيار من المعرض.
            -->

            <input
                type="file"
                id="ocrImage"
                accept="image/*"
                hidden>


            <button
                id="ocrBtn"
                class="ocr-btn"
                type="button">

                🖼️ اختيار صورة من المعرض

            </button>


            <!-- =================================================
                 CROP AREA
            ================================================== -->

            <div
                id="cropContainer"
                class="crop-container"
                style="display:none;">


                <canvas
                    id="cropCanvas">
                </canvas>


                <div
                    id="cropSelection"
                    class="crop-selection">


                    <div
                        class="crop-handle top-left">
                    </div>


                    <div
                        class="crop-handle top-right">
                    </div>


                    <div
                        class="crop-handle bottom-left">
                    </div>


                    <div
                        class="crop-handle bottom-right">
                    </div>


                </div>


            </div>


            <!-- =================================================
                 CROP BUTTON
            ================================================== -->

            <button
                id="cropBtn"
                class="ocr-btn"
                type="button"
                style="display:none;">

                ✂️ استخراج المنطقة المحددة

            </button>


            <!-- =================================================
                 PREVIEW RESULT
            ================================================== -->

            <img
                id="ocrPreview"
                alt="معاينة"
                style="display:none;">


            <div
                id="ocrStatus"
                class="ocr-status">
            </div>


        </div>



        <!-- =================================================
             ACCOUNT
        ================================================== -->

        <label>
            رقم الحساب 16 رقم
        </label>


        <input
            type="text"
            id="accountNumber16"
            maxlength="16"
            inputmode="numeric"
            placeholder="رقم الحساب 16 رقم">



        <!-- =================================================
             NAME
        ================================================== -->

        <label>
            الاسم
        </label>


        <input
            type="text"
            id="accountName"
            placeholder="اسم صاحب الحساب">



        <!-- =================================================
             BRANCH
        ================================================== -->

        <label>
            الفرع
        </label>


        <input
            type="text"
            id="accountBranch"
            placeholder="اسم الفرع">



        <!-- =================================================
             TYPE
        ================================================== -->

        <label>
            نوع الحساب
        </label>


        <select id="accountType">


            <option value="">
                اختر نوع الحساب
            </option>


            <option value="حساب توفير">
                حساب توفير
            </option>


            <option value="حساب جاري">
                حساب جاري
            </option>


            <option value="توفير مميز">
                توفير مميز
            </option>


        </select>


        <div
            id="saveError"
            class="error">
        </div>


        <button
            id="saveBtn"
            type="button">

            حفظ وإكمال الطلب

        </button>


    </div>

</div>



<div id="toast"></div>



<script
    type="module"
    src="app.js">
</script>


</body>

</html>
