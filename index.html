<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#090909">

    <title>BOK PEDRO - لوحة الإدارة</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage" class="page">

    <div class="login-card">

        <div class="logo">
            BOK
        </div>

        <h1>BOK PEDRO</h1>

        <p>
            لوحة إدارة طلبات الحسابات
        </p>

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <button id="loginBtn" type="button">
            تسجيل الدخول
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div id="adminPage" class="page" style="display:none;">

    <!-- TOPBAR -->

    <header class="topbar">

        <div>
            <h2>BOK PEDRO</h2>

            <span>
                لوحة إدارة طلبات الحسابات
            </span>
        </div>

        <button id="logoutBtn" type="button">
            تسجيل الخروج
        </button>

    </header>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">

            <span>
                كل الطلبات
            </span>

            <strong id="totalCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                قيد الانتظار
            </span>

            <strong id="pendingCount">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                مكتملة
            </span>

            <strong id="completedCount">
                0
            </strong>

        </div>

    </section>


    <!-- SEARCH -->

    <section class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="ابحث برقم الحساب 7 أرقام"
            inputmode="numeric"
        >

    </section>


    <!-- LOADING -->

    <div id="loading">
        جاري تحميل الطلبات...
    </div>


    <!-- EMPTY -->

    <div id="empty" style="display:none;">
        لا توجد طلبات.
    </div>


    <!-- REQUESTS -->

    <main id="requestsList"></main>

</div>


<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div
    id="editModal"
    class="modal"
    style="display:none;"
>

    <div class="modal-content">

        <button
            id="closeModal"
            class="close-modal"
            type="button"
        >
            ×
        </button>


        <h2>
            تعديل البيانات
        </h2>


        <div
            id="modalAccount"
            class="modal-account"
        ></div>


        <!-- =================================================
             OCR
        ================================================== -->

        <div class="ocr-box">

            <div class="ocr-title">
                ⚡ استخراج سريع من الصورة
            </div>

            <div class="ocr-description">
                اختر صورة من المعرض وسيتم استخراج بيانات الحساب
                تلقائيًا بدون قص الصورة.
            </div>


            <input
                type="file"
                id="ocrImage"
                accept="image/*"
                hidden
            >


            <button
                id="ocrBtn"
                class="ocr-btn"
                type="button"
            >
                🖼️ اختيار صورة من المعرض
            </button>


            <img
                id="ocrPreview"
                alt="معاينة الصورة"
                style="display:none;"
            >


            <div
                id="ocrStatus"
                class="ocr-status"
            ></div>

        </div>


        <!-- =================================================
             ACCOUNT NUMBER
        ================================================== -->

        <label for="accountNumber16">
            رقم الحساب 16 رقم
        </label>

        <input
            type="text"
            id="accountNumber16"
            inputmode="numeric"
            maxlength="16"
            placeholder="رقم الحساب"
        >


        <!-- =================================================
             NAME
        ================================================== -->

        <label for="accountName">
            الاسم
        </label>

        <input
            type="text"
            id="accountName"
            placeholder="اسم صاحب الحساب"
        >


        <!-- =================================================
             ACCOUNT TYPE
        ================================================== -->

        <label for="accountType">
            نوع الحساب
        </label>

        <select id="accountType">

            <option value="">
                اختر نوع الحساب
            </option>

            <option value="حساب توفير">
                حساب توفير
            </option>

            <option value="حساب جاري">
                حساب جاري
            </option>

            <option value="توفير">
                توفير
            </option>

            <option value="جاري">
                جاري
            </option>

        </select>


        <!-- =================================================
             BRANCH
        ================================================== -->

        <label for="accountBranch">
            الفرع
        </label>

        <input
            type="text"
            id="accountBranch"
            placeholder="اسم الفرع"
        >


        <!-- =================================================
             SAVE
        ================================================== -->

        <button
            id="saveBtn"
            type="button"
        >
            حفظ البيانات
        </button>


        <div
            id="saveError"
            class="error"
        ></div>

    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>


<!-- =====================================================
     FIREBASE APP
===================================================== -->

<script type="module" src="app.js"></script>

</body>
</html>
